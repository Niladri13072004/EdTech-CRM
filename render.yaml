# Render Blueprint: API service. Vercel hosts the React app and proxies /api/*
# to this service, keeping the browser session cookie same-origin.
#
# Secrets marked `sync: false` are entered in the Render dashboard when the
# Blueprint is created; they are never stored in this file.
services:
  - type: web
    name: edtech-crm-api-niladri13072004
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --prefix backend --omit=dev
    startCommand: npm start --prefix backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: SERVE_FRONTEND
        value: "false"
      # Vercel proxies the browser's same-origin requests to this API.
      - key: TRUST_PROXY
        value: "2"
      # Random 256-bit value generated by Render on first deploy.
      - key: JWT_SECRET
        generateValue: true
      # Supabase session-pooler connection string.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL_MODE
        value: verify-full
      # Supabase root CA certificate (PEM), required for verify-full TLS.
      - key: DATABASE_SSL_CA
        sync: false
      # Vercel production origin, used by CORS and the CSRF origin check.
      - key: FRONTEND_URL
        value: https://edtech-crm-hazel.vercel.app
